<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - GigaChad</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px 20px; max-width: 400px; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 24px; margin-bottom: 12px; }
        p { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 24px; }
        .btn { display: inline-block; background: #fff; color: #000; padding: 12px 32px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 16px; }
    </style>
    <script>
        // Try to redirect to the app via deep link
        window.onload = function() {
            const params = window.location.search;
            window.location.href = 'com.gigichad.app://auth-callback/verify' + params;
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="icon">&#10003;</div>
        <h1>Email Verified</h1>
        <p>Your email has been verified. Open the GigaChad app to continue.</p>
        <a href="com.gigichad.app://auth-callback/verify" class="btn">Open GigaChad</a>
    </div>
</body>
</html>
