<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigaChad – Legal</title>
  <style>
    :root { --accent: #1a1a1a; --muted: #555; --bg: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --accent: #f0f0f0; --muted: #999; --bg: #111; }
}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--accent); }
  header { padding: 48px 24px 32px; border-bottom: 1px solid rgba(128,128,128,.2); }
  header h1 { font-size: 28px; font-weight: 700; }
  header p  { margin-top: 8px; color: var(--muted); font-size: 15px; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 24px; }
  .cards { display: grid; gap: 16px; }
  .card { display: block; padding: 24px; border: 1px solid rgba(128,128,128,.25);
          border-radius: 12px; text-decoration: none; color: var(--accent);
          transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  .card h2 { font-size: 18px; margin-bottom: 6px; }
  .card p  { font-size: 14px; color: var(--muted); }
</style>
  </head>
  <body>
  <header>
    <h1>GigaChad</h1>
    <p>Legal documents and policies</p>
  </header>
  <main>
    <div class="cards">
      <a class="card" href="privacy.html">
        <h2>Privacy Policy</h2>
        <p>How we collect, use, and protect your information</p>
      </a>
      <a class="card" href="terms.html">
        <h2>Terms of Service</h2>
      <p>Rules and conditions for using GigaChad</p>
    </a>
    <a class="card" href="eula.html">
      <h2>End User License Agreement (EULA)</h2>
        <p>License terms for the GigaChad iOS application</p>
    </a>
  </div>
</main>
  </body>
  </html>
